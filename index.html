<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>花语人格测试</title>
    <meta
      name="description"
      content="回答 12 道温柔的小问题，先测出你的花型，再解锁更完整的花语档案。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="glow glow-a"></span>
      <span class="glow glow-b"></span>
      <span class="glow glow-c"></span>
      <span class="petal petal-a"></span>
      <span class="petal petal-b"></span>
      <span class="petal petal-c"></span>
      <span class="petal petal-d"></span>
      <span class="petal petal-e"></span>
    </div>

    <main id="app" class="app-shell">
      <section id="home-screen" class="screen screen-home is-active" aria-labelledby="home-title">
        <div class="home-desktop">
          <div class="home-copy">
            <p class="eyebrow home-badge">
              花语人格测试
            </p>
            <h1 id="home-title">
              每个人都有<br />
              自己的<span class="title-accent">开花</span>方式。
            </h1>
            <p class="lead">你的性格、情绪与偏爱，将会得知。</p>
            <div class="home-actions">
              <button class="button button-primary home-start-button" type="button" data-start-quiz>
                <span>开始测试</span>
              </button>
              <p class="microcopy">12 道轻问题</p>
            </div>
          </div>
          <div class="hero-garden" aria-hidden="true">
            <article class="paper-card hero-card floral-hero-card">
              <div class="hero-card-shell">
                <div class="hero-card-inner">
                  <p class="hero-card-kicker">花语人格测试</p>
                  <div class="hero-divider"><span></span></div>
                  <p class="hero-card-poem">
                    每一朵花，<br />
                    都在诉说独一无二的你。
                  </p>
                  <div class="hero-card-tags">
                    <span class="tag">阳光</span>
                    <span class="tag">温柔</span>
                    <span class="tag">自由</span>
                  </div>
                </div>
              </div>
            </article>
          </div>
        </div>
        <article class="paper-card home-mobile-card">
          <div class="home-mobile-inner">
            <p class="eyebrow home-mobile-kicker">花语人格测试</p>
            <div class="hero-divider hero-divider-mobile"><span></span></div>
            <h2 class="home-mobile-title">
              每个人都有自己的<span class="title-accent">开花</span>方式
            </h2>
            <p class="home-mobile-lead">你的性格、情绪与偏爱，将会得知。</p>
            <div class="hero-card-tags home-mobile-tags">
              <span class="tag">温柔细腻</span>
              <span class="tag">自由洒脱</span>
              <span class="tag">热情浪漫</span>
            </div>
            <button class="button button-primary home-start-button home-mobile-button" type="button" data-start-quiz>
              <span>开始测试</span>
            </button>
            <p class="microcopy home-mobile-microcopy">12 道轻问题</p>
          </div>
        </article>
      </section>

      <section id="quiz-screen" class="screen screen-quiz" aria-live="polite">
        <div class="quiz-topline">
          <button id="back-button" class="icon-button" type="button" aria-label="返回上一题">
            ‹
          </button>
          <div class="progress-wrap" aria-label="答题进度">
            <span id="progress-label">1 / 12</span>
            <div class="progress-track"><span id="progress-bar"></span></div>
          </div>
        </div>
        <article id="question-card" class="question-card"></article>
      </section>

      <section id="result-screen" class="screen screen-result">
        <div class="result-layout">
          <aside class="result-hero">
            <div id="result-flower" class="result-flower-card"></div>
            <div class="result-actions">
              <button id="copy-button" class="button button-secondary" type="button">
                复制文案
              </button>
              <button id="restart-button" class="button button-ghost" type="button">
                再测一次
              </button>
            </div>
            <p id="copy-status" class="status-text" role="status"></p>
          </aside>
          <article id="result-detail" class="result-detail"></article>
        </div>
      </section>
    </main>

    <script src="flower-quiz.js"></script>
  </body>
</html>
